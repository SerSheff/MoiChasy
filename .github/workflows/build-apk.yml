name: Build MoiChasy APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Install Android SDK
        run: yes | sdkmanager --licenses
        
      - name: Extract project
        run: unzip -q MoiChasy_Android_project.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/MoiChasyAndroid
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiChasy-APK
          path: extracted/MoiChasyAndroid/app/build/outputs/apk/debug/app-debug.apk
